name: Goldenforge nightly builds
on:
  push:
    branches:
      - 1.21.1
jobs:
  build:
    runs-on: [self-hosted, goldenforge]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Java
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew
      - name: Setup
        uses: gradle/actions/setup-gradle@v4
      - name: Clean and setup
        run: ./gradlew clean setup
      - name: Build jar
        run: ./gradlew installerjar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.5.0
        with:
          name: goldenforge-1.21.1
          path: projects/neoforge/build/libs/neoforge-*-installer.jar